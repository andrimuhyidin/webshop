openapi: 3.0.0
info:
  title: Webshop Headless API
  description: API documentation for the Webshop v2 Headless Transaction Engine.
  version: 2.0.0
servers:
  - url: http://site1.localhost:8000/api/method
    description: Local Development Server

paths:
  /webshop.api.v2.catalog.get_products:
    get:
      summary: Get Product List
      description: Retrieve a list of products with optional filtering.
      parameters:
        - name: industry_type
          in: query
          schema:
            type: string
          description: Filter by industry context (optional)
        - name: filters
          in: query
          schema:
            type: string
          description: JSON string of filters (e.g. `{"item_group": "Travel"}`)
      responses:
        '200':
          description: List of website items
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: array
                    items:
                      type: object

  /webshop.api.v2.catalog.get_product_detail:
    get:
      summary: Get Product Detail
      description: Retrieve detailed information for a specific product item, including generic metadata.
      parameters:
        - name: item_code
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: detailed item object
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      item_code:
                        type: string
                      item_name:
                        type: string
                      item_metadata:
                        type: object
                        description: Generic JSON metadata (e.g. generic rules, cancellation policies)

  /webshop.api.v2.transaction.check_availability:
    post:
      summary: Check Availability (RPC)
      description: Real-time check for stock or seat availability via active integration hooks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item_code:
                  type: string
                required_qty:
                  type: integer
                transaction_payload:
                  type: object
                  description: Context for availability (e.g. travel dates)
      responses:
        '200':
          description: Availability status
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      available:
                        type: boolean
                      message:
                        type: string

  /webshop.api.v2.transaction.create_order:
    post:
      summary: Create Sales Order
      description: Submit a new order with standard cart items and flexible transaction payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cart_items:
                  type: array
                  description: List of items and quantities
                transaction_payload:
                  type: object
                  description: Full order context (pax details, shipping info, custom notes)
      responses:
        '200':
          description: Order creation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      status:
                        type: string
                      order_name:
                        type: string

  /webshop.webshop.doctype.webshop_settings.webshop_settings.get_active_integrations:
    get:
      summary: Get Application Integrations
      description: Returns the status of installed optional modules (Travel, Wallet, Compliance).
      responses:
        '200':
          description: Integration status flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      travel:
                        type: boolean
                      wallet:
                        type: boolean
                      compliance:
                        type: boolean
